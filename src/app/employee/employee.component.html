<h1 class="text-center">Dolgozók</h1>

<table class="table table-striped table-info table-bordered table-hover mt-4">
    <thead>
        <tr>
            <th>ID</th>
            <th>Név</th>
            <th>Település</th>
            <th>Fizetés</th>
        </tr>
    </thead>
    <tbody>
         @for (emp of empList ; track emp.id) {
        <tr>
            <td>{{emp.id}}</td>
            <td>{{emp.name}}</td>
            <td>{{emp.city}}</td>
            <td>{{emp.salary}}</td>
        </tr>
    }
    </tbody>
</table>
